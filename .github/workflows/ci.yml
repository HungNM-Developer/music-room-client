name: ci

on:
  pull_request:
  push:
    branches: [develop, main, 'feat/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicroom
          POSTGRES_PASSWORD: musicroom
          POSTGRES_DB: musicroom
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U musicroom" --health-interval 5s --health-retries 20
    env:
      CI: 'true'
      DATABASE_URL: postgresql://musicroom:musicroom@localhost:5432/musicroom
    # Both repos side by side, as playwright.config.ts expects (../music-room-server).
    defaults:
      run:
        working-directory: music-room-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: music-room-client
      # Server source matching this client change: same owner as the PR head (a fork
      # for outside contributors) and the same branch name if it exists, else develop.
      - name: Pick server repository and branch
        id: server
        working-directory: .
        env:
          OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$OWNER/music-room-server.git" "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=develop" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$OWNER/music-room-server" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.server.outputs.repo }}
          ref: ${{ steps.server.outputs.ref }}
          path: music-room-server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build server
        working-directory: music-room-server
        run: npm ci && npx prisma migrate deploy && npm run build
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:e2e

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/music-room-client:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/music-room-client:latest
